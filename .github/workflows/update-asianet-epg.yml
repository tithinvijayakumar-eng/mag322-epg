name: Update Malayalam EPG from Airtel

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'scripts/update_malayalam_airtel.py'
      - '.github/workflows/update-asianet-epg.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch Malayalam Airtel EPG and update XMLTV
        run: python scripts/update_malayalam_airtel.py
      - name: Commit XMLTV if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MAG322_5CH_EXTERNAL_EPG_TEST.xml
          git diff --cached --quiet && exit 0
          git commit -m "Update Malayalam EPG from Airtel"
          git push
