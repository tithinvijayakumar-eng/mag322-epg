name: Update MAG322 EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'scripts/update_all_channels.py'
      - 'scripts/update_malayalam_airtel.py'
      - 'scripts/update_malayalam_airtel_fallbacks.py'
      - '.github/workflows/update-asianet-epg.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # Fill every confidently mapped playlist channel, then overlay our verified Malayalam feeds.
      - name: Update all mapped channels
        run: python scripts/update_all_channels.py
      - name: Overlay verified Malayalam sources
        run: python scripts/update_malayalam_airtel.py
      - name: Overlay Airtel fallbacks
        run: python scripts/update_malayalam_airtel_fallbacks.py
      - name: Commit XMLTV if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MAG322_5CH_EXTERNAL_EPG_TEST.xml
          git diff --cached --quiet && exit 0
          git commit -m "Update MAG322 EPG"
          git push
